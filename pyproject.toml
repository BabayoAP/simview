[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simview"
version = "0.1.0"
description = "Build, run, and visualize simulations of robots, vehicles, drones, and dynamic systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "mujoco>=3.3",
    "numpy>=1.26",
    "pyarrow>=15",
    "pygments>=2.17",
    "pyqtgraph>=0.13.7",
    # PySide6 6.12.0 over-releases True/False when emitting signals; on Python 3.11 (where
    # bools aren't immortal) that crashes the interpreter (D-074).
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "pyzmq>=26",
    "qtconsole>=5.6",
    "qtpy>=2.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# RL (PRD §8.1): Gymnasium envs, Stable-Baselines3 vector envs and PPO (pulls in PyTorch).
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]

[project.scripts]
simview = "simview.cli:main"

# TB-01: SimView's own toolboxes use the same entry point group as third-party ones.
[project.entry-points."simview.toolboxes"]
robotics = "simview.toolboxes.builtin:robotics"
aero = "simview.toolboxes.builtin:aero"
vehicles = "simview.toolboxes.builtin:vehicles"

[tool.hatch.build.targets.wheel]
packages = ["src/simview"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/PRD.md"]  # keep the PRD verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# T, R, J: the standard math names for transforms, rotations, and Jacobians.
"src/simview/toolboxes/robotics/**" = ["N803", "N806"]
# P, Q, R, F, H, K, S: the standard Kalman filter names.
"src/simview/toolboxes/aero/filters.py" = ["N802", "N803", "N806"]
"tests/**" = ["ANN", "N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads robots from MuJoCo Menagerie (skipped when SIMVIEW_OFFLINE=1)",
    "gl: needs an OpenGL display (runs only when SIMVIEW_GL=1)",
]
addopts = "-ra"
