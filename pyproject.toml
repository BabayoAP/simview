[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simview"
version = "0.1.0"
description = "Build, run, and visualize simulations of robots, vehicles, drones, and dynamic systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "pyarrow>=15",
    "PySide6>=6.6",
    "qtpy>=2.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
simview = "simview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simview"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/PRD.md"]  # keep the PRD verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# T, R, J: the standard math names for transforms, rotations, and Jacobians.
"src/simview/toolboxes/robotics/**" = ["N803", "N806"]
"tests/**" = ["ANN", "N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads robots from MuJoCo Menagerie (skipped when SIMVIEW_OFFLINE=1)"]
addopts = "-ra"
