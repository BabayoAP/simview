name: CI

# TEMPORARY debug branch: diagnose the macOS GL crash (exit 133) in
# test_scrubbing_redraws_the_real_viewport_within_100_ms. Delete this branch afterwards.
on:
  workflow_dispatch:

jobs:
  gl:
    runs-on: macos-latest
    env:
      SIMVIEW_GL: "1"
      SIMVIEW_OFFLINE: "1"
      QT_QPA_PLATFORM: cocoa
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - name: Crashing test, with a Python traceback on SIGTRAP
        run: |
          uv run --no-sync python -X faulthandler -c "
          import faulthandler, signal, sys
          faulthandler.register(signal.SIGTRAP, all_threads=True, chain=True)
          import pytest
          sys.exit(pytest.main(['-m', 'gl', '-v', '-s', '-k', 'scrubbing', 'tests/ui/test_viewport_gl.py']))
          "
      - name: Crash reports
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/*Python*; do echo "=== $f"; head -c 20000 "$f"; done || true
