name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.17.5 check .
      - run: uvx ruff@0.17.5 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SIMVIEW_CACHE: ${{ github.workspace }}/.simview-cache
    steps:
      - uses: actions/checkout@v4
      - name: Menagerie robot cache (RB-11, PRD R7)
        uses: actions/cache@v4
        with:
          path: .simview-cache
          key: menagerie-${{ hashFiles('src/simview/toolboxes/robotics/library.py') }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest --cov=simview --cov-report=term-missing
      - name: NF-09 coverage gate (simview/core >= 80%)
        run: uv run --no-sync coverage report --include="*/simview/core/*" --fail-under=80
