name: CI

# Manual or PR-only (D-088): private-repo minutes are limited and macOS bills at 10x.
# Run it from the Actions tab or `gh workflow run CI --ref <branch>` before asking to merge.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.17.5 check .
      - run: uvx ruff@0.17.5 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SIMVIEW_CACHE: ${{ github.workspace }}/.simview-cache
    steps:
      - uses: actions/checkout@v4
      - name: Menagerie robot cache (RB-11, PRD R7)
        uses: actions/cache@v4
        with:
          path: .simview-cache
          key: menagerie-${{ hashFiles('src/simview/toolboxes/robotics/library.py') }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest --cov=simview --cov-report=term-missing
      - name: NF-09 coverage gate (simview/core >= 80%)
        run: uv run --no-sync coverage report --include="*/simview/core/*" --fail-under=80

  # The real OpenGL viewport (tests marked `gl`). Linux renders with Mesa under a virtual X
  # display; macOS with its own GL. Windows runners only offer OpenGL 1.1, below VTK's 3.2, so
  # Windows GL is covered on a development machine instead (D-044).
  gl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIMVIEW_GL: "1"
      SIMVIEW_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: X server, Mesa, and Qt xcb libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0
      - run: uv pip install -e ".[dev]"
      - name: GL tests (Linux, xvfb)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" uv run --no-sync pytest -m gl -v
      - name: GL tests (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: uv run --no-sync pytest -m gl -v
